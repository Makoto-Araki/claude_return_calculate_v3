[project]
name = "claude-return-calculate-v3"
version = "0.1.0"
description = "2つの正の整数を受け取り、四則演算を行う計算APIサーバー"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D", "S"]

ignore = [
    "D400",  # 日本語の句点「。」を終端記号として認識しないため除外
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]  # 空のパッケージ初期化ファイルは docstring 不要
"tests/**" = ["S101"]  # pytest は assert 文で検証するため許可

[tool.mypy]
python_version = "3.12"
strict = true
